<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/products">Shop<span>Sphere</span></a>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search products…" />
    <button id="searchBtn" class="icon-btn" title="Search">⌕</button>
  </div>

  <nav class="topnav">
    <a href="#/products">Catalog</a>
    <a href="#/orders" class="auth-only">Orders</a>
    <a href="#/admin/products" class="admin-only">Admin</a>
  </nav>

  <div class="topbar-right">
    <a href="#/cart" class="cart-link auth-only">
      Cart <span id="cartCount" class="badge">0</span>
    </a>
    <span id="userChip" class="user-chip"></span>
    <a href="#/login" id="loginLink" class="btn-ghost">Sign in</a>
    <button id="logoutBtn" class="btn-ghost auth-only" style="display:none">Sign out</button>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast"></div>

<!-- ================= TEMPLATES ================= -->

<template id="tpl-login">
  <section class="auth-page">
    <form class="ticket-card auth-card" id="loginForm">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to your ShopSphere account.</p>
      <label>Email
        <input type="email" name="email" required />
      </label>
      <label>Password
        <input type="password" name="password" required minlength="8" />
      </label>
      <button class="btn-primary" type="submit">Sign in</button>
      <p class="switch-line">New here? <a href="#/register">Create an account</a></p>
    </form>
  </section>
</template>

<template id="tpl-register">
  <section class="auth-page">
    <form class="ticket-card auth-card" id="registerForm">
      <h1>Create your account</h1>
      <p class="muted">It takes less than a minute.</p>
      <label>Full name
        <input type="text" name="name" required />
      </label>
      <label>Email
        <input type="email" name="email" required />
      </label>
      <label>Phone
        <input type="tel" name="phone" required />
      </label>
      <label>Password
        <input type="password" name="password" required minlength="8" />
        <small class="muted">At least 8 characters.</small>
      </label>
      <button class="btn-primary" type="submit">Create account</button>
      <p class="switch-line">Already registered? <a href="#/login">Sign in</a></p>
    </form>
  </section>
</template>

<template id="tpl-products">
  <section class="catalog">
    <aside class="filters">
      <h2>Categories</h2>
      <ul id="categoryList" class="category-list">
        <li><button class="cat-btn is-active" data-id="">All products</button></li>
      </ul>
      <h2>Sort by</h2>
      <select id="sortSelect">
        <option value="-createdAt">Newest</option>
        <option value="price">Price: low to high</option>
        <option value="-price">Price: high to low</option>
        <option value="-ratingsAverage">Top rated</option>
      </select>
    </aside>
    <div class="catalog-main">
      <div class="catalog-head">
        <h1 id="catalogTitle">All products</h1>
        <span id="resultCount" class="muted"></span>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div class="pager">
        <button id="prevPage" class="btn-ghost">← Prev</button>
        <span id="pageLabel" class="muted"></span>
        <button id="nextPage" class="btn-ghost">Next →</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-product-detail">
  <section class="product-detail">
    <div class="pd-gallery">
      <img id="pdImage" src="" alt="" />
    </div>
    <div class="pd-info">
      <p class="pd-category" id="pdCategory"></p>
      <h1 id="pdName"></h1>
      <p class="pd-price">
        <span id="pdPrice" class="price-now"></span>
        <span id="pdOldPrice" class="price-old"></span>
      </p>
      <p id="pdStock" class="stock-pill"></p>
      <p id="pdDescription" class="pd-desc"></p>
      <div class="pd-buy">
        <input type="number" id="pdQty" value="1" min="1" />
        <button id="pdAddToCart" class="btn-primary">Add to cart</button>
      </div>
      <p id="pdMsg" class="form-msg"></p>
    </div>
  </section>
</template>

<template id="tpl-cart">
  <section class="cart-page">
    <h1>Your cart</h1>
    <div id="cartEmpty" class="empty-state" hidden>
      <p>Your cart is empty.</p>
      <a href="#/products" class="btn-primary">Browse products</a>
    </div>
    <div id="cartContent">
      <div class="cart-list" id="cartList"></div>
      <aside class="ticket-card cart-summary">
        <h2>Order summary</h2>
        <div class="summary-row"><span>Items</span><span id="sumItems">0</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
        <hr />
        <form id="checkoutForm">
          <label>Street
            <input type="text" name="street" required />
          </label>
          <label>City
            <input type="text" name="city" required />
          </label>
          <label>Phone
            <input type="text" name="phone" required />
          </label>
          <label>Payment method
            <select name="paymentMethod">
              <option value="cash">Cash on delivery</option>
              <option value="card">Card (Stripe)</option>
            </select>
          </label>
          <button class="btn-primary" type="submit">Place order</button>
        </form>
        <p id="checkoutMsg" class="form-msg"></p>
      </aside>
    </div>
  </section>
</template>

<template id="tpl-orders">
  <section class="orders-page">
    <h1>Your orders</h1>
    <div id="ordersEmpty" class="empty-state" hidden><p>You have no orders yet.</p></div>
    <div id="ordersList" class="orders-list"></div>
  </section>
</template>

<template id="tpl-order-detail">
  <section class="order-detail">
    <a href="#/orders" class="back-link">← All orders</a>
    <div class="ticket-card">
      <div class="od-head">
        <h1>Order <span id="odId"></span></h1>
        <span id="odStatus" class="status-pill"></span>
      </div>
      <p class="muted" id="odDate"></p>
      <div id="odItems" class="od-items"></div>
      <hr />
      <div class="summary-row total"><span>Total</span><span id="odTotal"></span></div>
      <div class="admin-only" id="odAdminActions">
        <label>Update status
          <select id="odStatusSelect">
            <option value="pending">pending</option>
            <option value="paid">paid</option>
            <option value="shipped">shipped</option>
            <option value="delivered">delivered</option>
            <option value="cancelled">cancelled</option>
          </select>
        </label>
        <button id="odUpdateBtn" class="btn-ghost">Update</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-admin-products">
  <section class="admin-page">
    <nav class="admin-tabs">
      <a href="#/admin/products" class="is-active">Products</a>
      <a href="#/admin/categories">Categories</a>
    </nav>
    <div class="admin-grid">
      <form id="productForm" class="ticket-card">
        <h2 id="productFormTitle">New product</h2>
        <input type="hidden" name="_id" />
        <label>Name<input type="text" name="name" required /></label>
        <label>Slug<input type="text" name="slug" required /></label>
        <label>Description<textarea name="description" required></textarea></label>
        <div class="two-col">
          <label>Price<input type="number" step="0.01" name="price" required /></label>
          <label>Discount price<input type="number" step="0.01" name="discountPrice" /></label>
        </div>
        <div class="two-col">
          <label>Stock<input type="number" name="stock" required /></label>
          <label>Category
            <select name="category" id="productCategorySelect" required></select>
          </label>
        </div>
        <label>Image URL<input type="text" name="images" placeholder="https://…" /></label>
        <label class="checkbox-row"><input type="checkbox" name="isActive" checked /> Active</label>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Save product</button>
          <button class="btn-ghost" type="button" id="productFormReset">Clear</button>
        </div>
        <p id="productFormMsg" class="form-msg"></p>
      </form>
      <div class="admin-list" id="adminProductList"></div>
    </div>
  </section>
</template>

<template id="tpl-admin-categories">
  <section class="admin-page">
    <nav class="admin-tabs">
      <a href="#/admin/products">Products</a>
      <a href="#/admin/categories" class="is-active">Categories</a>
    </nav>
    <div class="admin-grid">
      <form id="categoryForm" class="ticket-card">
        <h2 id="categoryFormTitle">New category</h2>
        <input type="hidden" name="_id" />
        <label>Name<input type="text" name="name" required /></label>
        <label>Slug<input type="text" name="slug" required /></label>
        <label>Description<textarea name="description"></textarea></label>
        <label>Image URL<input type="text" name="image" /></label>
        <label class="checkbox-row"><input type="checkbox" name="isActive" checked /> Active</label>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Save category</button>
          <button class="btn-ghost" type="button" id="categoryFormReset">Clear</button>
        </div>
        <p id="categoryFormMsg" class="form-msg"></p>
      </form>
      <div class="admin-list" id="adminCategoryList"></div>
    </div>
  </section>
</template>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
